[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traductor"
version = "0.1.0"
description = "Traductor de articulos .docx ES <-> EN con DeepSeek, conservando el formato"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5",
    "openai>=1",
    "PyYAML>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
interfaz = ["gradio>=5,<7"]

[project.scripts]
traductor = "traductor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
